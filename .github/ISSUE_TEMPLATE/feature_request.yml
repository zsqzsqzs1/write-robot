name: 功能建议
description: 提出新功能或改进想法
labels: ["功能建议"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 想实现什么
      description: 描述你希望增加的能力
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 为什么要这个功能
      description: 它能解决什么实际问题
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
